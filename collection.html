<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Men's T-Shirts — Reaching Dreams</title>
<meta name="description" content="Shop oversized t-shirts, graphic tees and heavyweight cotton streetwear from Reaching Dreams. Filter by size, colour, fit and theme.">
<link rel="icon" href="assets/rd-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="collection">

<div id="chrome-header"></div>

<main class="wrap">
  <button class="filter-toggle" id="filter-toggle">Filter &amp; sort</button>
  <div class="plp">
    <aside class="filters" id="filters"></aside>
    <section>
      <nav class="crumbs"><a href="index.html">Home</a> / <span id="crumb-now">Men T-Shirts</span></nav>
      <div class="plp-head">
        <h1 id="plp-title">Men T-Shirts</h1>
        <span id="plp-count"></span>
        <select id="sort">
          <option value="relevance">Relevance</option>
          <option value="new">What's New</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
      </div>
      <div class="grid" id="plp-grid"></div>
      <p class="empty" id="plp-empty" hidden>No products match these filters.</p>
    </section>
  </div>
</main>

<div id="chrome-footer"></div>
<script src="app.js"></script>
</body>
</html>
